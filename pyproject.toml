[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellstate"
version = "0.1.0"
description = "Reproducible cross-dataset analysis of single-cell RNA-seq data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "CellState contributors"}]
dependencies = [
  "anndata>=0.10,<1", "scanpy>=1.10,<2", "numpy>=1.24,<3", "pandas>=2,<4",
  "scipy>=1.11,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1", "PyYAML>=6,<7", "igraph>=0.11,<2", "leidenalg>=0.10,<1"
]

[project.optional-dependencies]
doublets = ["scrublet>=0.2.3,<1"]
test = ["pytest>=8,<10", "coverage>=7,<8"]
seurat-v3 = ["scikit-misc>=0.3,<1"]
lint = ["ruff>=0.6,<1"]

[project.scripts]
cellstate = "cellstate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

[tool.coverage.run]
source = ["cellstate"]
branch = true
